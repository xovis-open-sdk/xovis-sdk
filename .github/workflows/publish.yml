name: Publish to PyPI, NPM, and Smithery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    name: Upload release to PyPI, NPM, and Smithery
    runs-on: ubuntu-latest
    if: github.repository_owner == 'xovis-open-sdk' # Strict security guard to protect tenant execution
    environment: pypi # Bound environment for trusted cryptographic identity tokens
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure Git for LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 1. PYTHON / PYPI BUILD & PUBLISH
      # ==========================================
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build Python package
        run: uv build
      
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # ==========================================
      # 2. NODE / NPM BUILD & PUBLISH
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Publish to NPM
        # Node 24 & npm v11 automatically generate provenance and handle OIDC natively.
        # No tokens are needed! We must specify '--tag next' when publishing prereleases to the registry.
        run: npm publish --access public --tag next

      # ==========================================
      # 3. SMITHERY MCP DEPLOYMENT
      # ==========================================
      - name: Pack Smithery MCP Bundle
        run: |
          python -c "import zipfile, os; zipf = zipfile.ZipFile('server.mcpb', 'w', zipfile.ZIP_DEFLATED); [zipf.write(os.path.join(r, f), os.path.relpath(os.path.join(r, f), 'bundle_dir')) for r, d, fs in os.walk('bundle_dir') for f in fs]; zipf.close()"

      - name: Publish to Smithery
        env:
          SMITHERY_TOKEN: ${{ secrets.SMITHERY_TOKEN }}
        run: |
          # Wait 30 seconds for PyPI index to update so uvx can fetch the new version
          sleep 30
          npx @smithery/cli@latest mcp publish ./server.mcpb -n @xovis-sdk/xovis-mcp
