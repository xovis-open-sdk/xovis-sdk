name: Publish to PyPI and NPM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    name: Upload release to PyPI and NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'xovis-open-sdk'
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 1. PYTHON / PYPI BUILD & PUBLISH
      # ==========================================
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run Quality Check (Lint)
        run: uv run --extra test ruff check .

      - name: Run Quality Check (Tests)
        run: uv run --extra all pytest tests/ -m "not destructive"

      - name: Build Python package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # ==========================================
      # 2. NODE / NPM BUILD & PUBLISH
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM (with Provenance)
        # The --provenance flag tells NPM to use the OIDC id-token
        # instead of looking for a traditional NPM_TOKEN secret.
        run: npm publish --provenance --access public