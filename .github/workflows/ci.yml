name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git for LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run Ruff Check
        run: uv run --extra test ruff check .
      - name: Run Ruff Format Check
        run: uv run --extra test ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      XOVIS_TEST_HOST: ${{ secrets.XOVIS_TEST_HOST }}
      XOVIS_TEST_USER: ${{ secrets.XOVIS_TEST_USER }}
      XOVIS_TEST_PASS: ${{ secrets.XOVIS_TEST_PASS }}
      XOVIS_HUB_CLIENT_ID: ${{ secrets.XOVIS_HUB_CLIENT_ID }}
      XOVIS_HUB_CLIENT_SECRET: ${{ secrets.XOVIS_HUB_CLIENT_SECRET }}
    steps:
      - name: Configure Git for LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run Non-Destructive Tests
        run: uv run --extra all pytest tests/ -m "not destructive"
      - name: Run Destructive Tests (Mocked)
        run: uv run --extra all pytest tests/ -m "destructive"

  cli-dry-run:
    name: CLI Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git for LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: CLI Help Check
        run: uv run xovis-cli --help

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git for LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run Bandit Scan
        run: uv run --extra test bandit -r src/ -ll

  docs-readiness:
    name: Documentation Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git for LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Enforce Docstrings
        run: uv run xovis-cli docs check-docstrings
