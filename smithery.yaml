name: xovis-mcp
displayName: Xovis SDK MCP Server
description: Unofficial Xovis Hardware integration via MCP that seamlessly bridges the Xovis Python SDK to autonomous AI agents. Features zero-trust format-preserving pseudonymization (AIPrivacySession) and human-in-the-loop safety guardrails (XovisSafetyGuardrail) for critical operations.
version: 1.0.0a29
homepage: https://github.com/xovis-open-sdk/xovis-sdk
category: Data
categories:
  - Data
  - IoT
  - AI
tags:
  - xovis
  - mcp
  - people-counting
  - people-tracking
  - in-store-analytics
  - spatial-intelligence
  - retail-analytics

startCommand:
  type: stdio

  # Prompts Smithery UI/CLI to collect required credentials from the user
  configSchema:
    type: object
    properties:
      XOVIS_HUB_CLIENT_ID:
        type: string
        description: "Xovis Cloud Hub Client ID (Auth0 - Optional for Cloud)"
      XOVIS_HUB_CLIENT_SECRET:
        type: string
        description: "Xovis Cloud Hub Client Secret (Auth0 - Optional for Cloud)"
      XOVIS_MCP_HOST:
        type: string
        default: "127.0.0.1"
        description: "Device IP/Host (Used if Hub credentials are left blank)"
      XOVIS_MCP_USER:
        type: string
        default: "admin"
        description: "Device Username"
      XOVIS_MCP_PASS:
        type: string
        description: "Device Password"

  # Dynamically pull the published PyPI artifact and inject the exact vars server.py expects
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: [
        '-q',
        '--from', 'xovis-sdk[mcp]==1.0.0a29',
        'xovis-mcp'
      ],
      env: {
        XOVIS_HUB_CLIENT_ID: config.XOVIS_HUB_CLIENT_ID || "",
        XOVIS_HUB_CLIENT_SECRET: config.XOVIS_HUB_CLIENT_SECRET || "",
        XOVIS_MCP_HOST: config.XOVIS_MCP_HOST || "127.0.0.1",
        XOVIS_MCP_USER: config.XOVIS_MCP_USER || "admin",
        XOVIS_MCP_PASS: config.XOVIS_MCP_PASS || ""
      }
    })



