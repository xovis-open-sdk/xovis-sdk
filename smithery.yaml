# smithery.yaml
name: xovis-sdk-mcp
displayName: Xovis SDK MCP Server
description: Unofficial Xovis Hardware and Cloud Hub Integration for MCP
version: 1.0.0a2
category: Development

startCommand:
  type: stdio
  
  # Prompts Smithery UI/CLI to collect required credentials
  configSchema:
    type: object
    properties:
      XOVIS_CLIENT_ID:
        type: string
        description: "Xovis Cloud Hub Client ID (Auth0)"
      XOVIS_CLIENT_SECRET:
        type: string
        description: "Xovis Cloud Hub Client Secret (Auth0)"
      NTLM_AUTH:
        type: string
        default: "true"
        description: "Use Windows SSO for local devices (true/false)"
      DC_USERNAME:
        type: string
        description: "Device Connector Username (if NTLM is false)"
      DC_PASSWORD:
        type: string
        description: "Device Connector Password (if NTLM is false)"
        
  # Dynamically pull the published PyPI artifact
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: [
        '--from', 'xovis-sdk==1.0.0a2',
        'xovis-mcp'
      ],
      env: {
        XOVIS_CLIENT_ID: config.XOVIS_CLIENT_ID,
        XOVIS_CLIENT_SECRET: config.XOVIS_CLIENT_SECRET,
        NTLM_AUTH: config.NTLM_AUTH,
        DC_USERNAME: config.DC_USERNAME,
        DC_PASSWORD: config.DC_PASSWORD
      }
    })