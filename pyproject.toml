[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xovis-sdk"
version = "1.0.0a0"
description = "Enterprise-grade integration SDK for Xovis 3D Sensors, Spiders and HUB."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Xovis Open SDK Team", email = "xovis.sdk@proton.me" },
]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.0",
    "aiomqtt>=2.0.0",
    "pydantic>=2.10.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "mcp>=1.2.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff",
    "datamodel-code-generator>=0.26.0",
]
tui = [
    "textual>=0.50.0",
    "questionary>=2.0.0",
]
windows-sso = [
    "httpx-ntlm>=1.3.0",
]
uvloop = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.scripts]
xovis-cli = "xovis.cli:main"
xovis-mcp = "xovis.mcp.server:main"

[tool.ruff]
line-length = 150
target-version = "py311"
lint.extend-select = ["I", "F"]
lint.ignore = ["E402", "E741", "F401", "F403"]
exclude = ["src/xovis/models/device_auto/"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
exclude = ["src/xovis/models/device_auto/"]

[tool.pylint.MASTER]
ignore-paths = ["src/xovis/models/.*_auto\\.py"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114", # Missing module docstring (we use check-docs for this)
    "C0115", # Missing class docstring
    "C0116", # Missing function docstring
    "R0903", # Too few public methods
    "C0103", # Invalid name (pydantic aliases often trigger this)
]

[tool.pylint.SIMILARITIES]
min-similarity-lines = 10
ignore-comments = "yes"
ignore-docstrings = "yes"
ignore-imports = "yes"

[tool.bandit]
exclude_dirs = ["tests", "src/xovis/models/device_auto/"]
skips = ["B104"] # Allow binding to 0.0.0.0 for servers

[tool.hatch.build.targets.wheel]
packages = ["src/xovis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "destructive: tests that modify hardware state",
]