[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xovis-sdk"
version = "1.0.0a28"
description = "Enterprise-grade integration SDK for Xovis 3D Sensors, Spiders and HUB."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Xovis Open SDK Team", email = "xovis.sdk@proton.me" },
]
license = { text = "MIT" }

# SEO & PyPI Discovery
keywords = ["xovis", "people-counting", "people-tracking", "stereoscopic", "iot", "mcp", "ai", "edge-computing"]

# PyPI Badges and Metadata
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

# CORE DEPENDENCIES (Lightning fast, zero AI bloat)
dependencies = [
    "httpx>=0.28.0",
    "aiomqtt>=2.0.0",
    "pydantic>=2.10.0",
    "orjson>=3.10.0",
    "tenacity==9.1.4",
    "multidict>=6.7.0",
]

[project.urls]
Documentation = "https://xovis-open-sdk.github.io/xovis-sdk/"
Repository = "https://github.com/xovis-open-sdk/xovis-sdk"
"Bug Tracker" = "https://github.com/xovis-open-sdk/xovis-sdk/issues"
Smithery = "https://smithery.ai/server/xovis-sdk"


[project.optional-dependencies]
# --- AGENTIC & AI FIREWALL ---
langchain = [
    "langchain-core>=0.1.0",
]
crewai = [
    "crewai>=0.11.2",
]
mcp = [
    "mcp>=1.3.0",
    "aiohttp>=3.11.0",
]
# Meta-group for data scientists who want everything
ai = ["xovis-sdk[langchain,crewai,mcp]"]

# --- INFRASTRUCTURE & UI ---
tui = [
    "textual>=0.50.0",
    "questionary>=2.0.0",
]
windows-sso = [
    "httpx-ntlm>=1.3.0",
]
uvloop = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

# --- DEVELOPMENT ---
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff",
    "bandit",
    "datamodel-code-generator>=0.26.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "mkdocs-static-i18n>=1.2.0",
]
# Provide an 'all' install for core contributors
all = ["xovis-sdk[ai,tui,windows-sso,uvloop,test,docs]"]


[project.scripts]
xovis-cli = "xovis.cli:main"
xovis-mcp = "xovis.mcp.server:main"


[tool.ruff]
line-length = 150
target-version = "py311"
lint.extend-select = ["I", "F"]
lint.ignore = ["E402", "E741", "F401", "F403"]
exclude = ["src/xovis/models/device_auto/"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
exclude = ["src/xovis/models/device_auto/"]

[tool.pylint.MASTER]
ignore-paths = ["src/xovis/models/.*_auto\\.py"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114", # Missing module docstring
    "C0115", # Missing class docstring
    "C0116", # Missing function docstring
    "R0903", # Too few public methods
    "C0103", # Invalid name (pydantic aliases often trigger this)
]

[tool.pylint.SIMILARITIES]
min-similarity-lines = 10
ignore-comments = "yes"
ignore-docstrings = "yes"
ignore-imports = "yes"

[tool.bandit]
exclude_dirs = ["tests", "src/xovis/models/device_auto/"]
skips = ["B104"] # Allow binding to 0.0.0.0 for servers

[tool.hatch.build.targets.wheel]
packages = ["src/xovis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "destructive: tests that modify hardware state",
]

